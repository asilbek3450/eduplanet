{% extends "dashboard/base.html" %}

{% block content %}
<div class="row">
  <div class="col-md-6 offset-md-3">
    <div class="card form-section">
      <h5 class="text-danger"><i class="mdi mdi-alert-circle"></i> O‘chirishni tasdiqlang</h5>
      <p class="text-muted">Quyidagi yozuvni o‘chirmoqchimisiz? Ushbu amalni qaytarib bo‘lmaydi.</p>
      <div class="alert alert-light border">
        <strong>{{ instance }}</strong>
      </div>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-end">
          <a href="{{ cancel_url }}" class="btn btn-light mr-2">Bekor qilish</a>
          <button type="submit" class="btn btn-danger"><i class="mdi mdi-delete"></i> O‘chirish</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
