{% extends 'base.html' %}
{% block content %}
<section class="mx-auto max-w-4xl px-4 py-12 sm:px-6 lg:px-8"><a href="{% url 'profile' %}?lang={{ lang }}#teaching" class="text-sm font-semibold text-slate-500 hover:text-sky-600">← Profilga qaytish</a><div class="mt-6 rounded-[2rem] border border-slate-200 bg-white p-6 shadow-sm sm:p-10"><p class="text-xs font-semibold uppercase tracking-[0.24em] text-sky-600">O‘qituvchi profili</p><h1 class="mt-3 text-3xl font-bold text-slate-950">{{ title }}</h1><form method="post" class="mt-8 space-y-6">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div><label for="{{ field.id_for_label }}" class="mb-2 block text-sm font-semibold text-slate-700">{{ field.label }}{% if field.field.required %} *{% endif %}</label>{{ field }}{% if field.help_text %}<p class="mt-2 text-xs leading-6 text-slate-500">{{ field.help_text }}</p>{% endif %}<div class="mt-2 text-sm text-rose-600">{{ field.errors }}</div></div>{% endfor %}<div class="flex flex-wrap justify-end gap-3 border-t border-slate-100 pt-6"><a href="{% url 'profile' %}?lang={{ lang }}#teaching" class="rounded-full border border-slate-200 px-6 py-3 text-sm font-semibold text-slate-700">Bekor qilish</a><button class="rounded-full bg-slate-900 px-6 py-3 text-sm font-semibold text-white hover:bg-sky-600">Saqlash</button></div></form></div></section>
{% endblock %}
